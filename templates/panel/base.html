<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · SimpleDesk</title>
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="/panel.css?v={{ crate::panel::css_version() }}">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/icon-512.png" sizes="512x512" type="image/png">
  <link rel="apple-touch-icon" href="/icon-180.png">
</head>
<body>
  <header class="top">
    <span class="brand"><img src="/icon.svg" alt="" width="28" height="28">SimpleDesk</span>
    {% block nav %}{% endblock %}
  </header>
  <main>
    {% block banner %}{% endblock %}
    {% block content %}{% endblock %}
  </main>
  <footer class="source">
    SimpleDesk ist Open Source (AGPL) · <a href="https://github.com/SimpleDesk-Org/simpledesk-server">Quellcode</a>
  </footer>
</body>
</html>
