[package]
name = "hbbs"
version = "1.1.17"
authors = ["rustdesk"]
edition = "2021"
build = "build.rs"
default-run = "hbbs"

[[bin]]
name = "hbbr"
path = "src/hbbr.rs"

[[bin]]
name = "rustdesk-utils"
path = "src/utils.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hbb_common = { path = "libs/hbb_common" }
serde_derive = "1.0"
serde = "1.0"
serde_json = "1.0"
lazy_static = "1.4"
clap = "2"
rust-ini = "0.18"
minreq = { version = "2.4", features = ["punycode"] }
machine-uid = "0.2"
mac_address = "1.1.5"
whoami = "1.2"
base64 = "0.13"
axum = { version = "0.5", features = ["headers"] }
sqlx = { version = "0.6", features = [ "runtime-tokio-rustls", "sqlite", "macros", "chrono", "json" ] }
deadpool = "0.8"
async-trait = "0.1"
async-speed-limit = { git = "https://github.com/open-trade/async-speed-limit" }
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
jsonwebtoken = "8"
headers = "0.3"
once_cell = "1.8"
sodiumoxide = "0.2"
tempfile = "3"
tokio-tungstenite = { git = "https://github.com/SimpleDesk-Org/tokio-tungstenite", rev = "c241b11b03de4881faf1ecd2fe6e867c92f3013b", version = "0.29" }
tungstenite = "0.29"
regex = "1.4"
tower-http = { version = "0.3", features = ["fs", "trace", "cors"] }
http = "0.2"
flexi_logger = { version = "0.22", features = ["async", "use_chrono_for_offset", "dont_minimize_extra_stacks"] }
ipnetwork = "0.20"
local-ip-address = "0.5.1"
dns-lookup = "1.0.8"
ping = "0.4.0"
flate2 = "1.0"
# SimpleDesk: HTML templates of the web panel
askama = "0.16"
# SimpleDesk: alarm mails over SMTP, TLS with rustls (no OpenSSL)
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"] }

[dev-dependencies]
# SimpleDesk: tests of the web panel
tower = { version = "0.4", features = ["util"] }
hyper = "0.14"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# RustDesk Server Pro issue #189, using native-tls for better tls support
reqwest = { git = "https://github.com/SimpleDesk-Org/reqwest", rev = "9cb758c9fb2f4edc62eb790acfd45a6a3da21ed3", features = ["blocking", "socks", "json", "native-tls", "gzip"], default-features=false }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
reqwest = { git = "https://github.com/SimpleDesk-Org/reqwest", rev = "9cb758c9fb2f4edc62eb790acfd45a6a3da21ed3", features = ["blocking", "socks", "json", "rustls-tls", "rustls-tls-native-roots", "gzip"], default-features=false }

[build-dependencies]
hbb_common = { path = "libs/hbb_common" }

[workspace]
members = ["libs/hbb_common"]
exclude = ["ui"]

#https://github.com/johnthagen/min-sized-rust
#https://doc.rust-lang.org/cargo/reference/profiles.html#default-profiles
[profile.release]
lto = true
codegen-units = 1
panic = 'abort'
strip = true
#opt-level = 'z' # only have smaller size after strip # Default is 3, better performance
#rpath = true # Not needed

[patch.crates-io]
tungstenite = { git = "https://github.com/SimpleDesk-Org/tungstenite-rs", rev = "efce47e5364f00a63302cf07ab1fb13ded478914" }

# SimpleDesk: libs/hbb_common still takes these from RustDesk's forks; use ours at the same commits.
[patch."https://github.com/rustdesk-org/confy"]
confy = { git = "https://github.com/SimpleDesk-Org/confy", rev = "83db9ec19a2f97e9718aef69e4fc5611bb382479" }

[patch."https://github.com/rustdesk-org/tokio-socks"]
tokio-socks = { git = "https://github.com/SimpleDesk-Org/tokio-socks", rev = "94e97c6d7c93b0bcbfa54f2dc397c1da0a6e43d3" }

[patch."https://github.com/rustdesk-org/sysinfo"]
sysinfo = { git = "https://github.com/SimpleDesk-Org/sysinfo", rev = "90b1705d909a4902dbbbdea37ee64db17841077d" }

[patch."https://github.com/rustdesk-org/default_net"]
default_net = { git = "https://github.com/SimpleDesk-Org/default_net", rev = "78f8f70cd85151a3a2c4a3230d80d5272703c02e" }

[patch."https://github.com/rustdesk-org/machine-uid"]
machine-uid = { git = "https://github.com/SimpleDesk-Org/machine-uid", rev = "381ff579c1dc3a6c54db9dfec47c44bcb0246542" }
